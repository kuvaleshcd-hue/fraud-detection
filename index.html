<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shield FDS - Advanced Neural Risk Intelligence Engine</title>
  
  <!-- Premium Fonts: Inter for general UI, JetBrains Mono for system terminals and code -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- CDNs for React, Recharts, and Babel compilation -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    :root {
      --bg-main: #060813;
      --card-bg: rgba(10, 15, 30, 0.7);
      --card-border: 1px solid rgba(59, 130, 246, 0.16);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #4b5563;
      
      /* Neon Accent System */
      --accent-cyan: #00f0ff;
      --accent-cyan-dim: rgba(0, 240, 255, 0.1);
      --accent-green: #39ff14;
      --accent-green-dim: rgba(57, 255, 20, 0.1);
      --accent-orange: #ff9900;
      --accent-orange-dim: rgba(255, 153, 0, 0.1);
      --accent-red: #ff003c;
      --accent-red-dim: rgba(255, 0, 60, 0.1);
      --accent-purple: #8b5cf6;
      
      --shadow-glow: 0 0 15px rgba(0, 240, 255, 0.15);
      --shadow-red-glow: 0 0 15px rgba(255, 0, 60, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(at 0% 0%, rgba(0, 240, 255, 0.08) 0px, transparent 40%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.05) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(255, 0, 60, 0.03) 0px, transparent 50%);
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Scrollbar Design */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.01);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(59, 130, 246, 0.25);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
    }

    /* Animations */
    @keyframes pulse-cyan {
      0%, 100% { opacity: 0.5; box-shadow: 0 0 5px rgba(0, 240, 255, 0.2); }
      50% { opacity: 1; box-shadow: 0 0 15px rgba(0, 240, 255, 0.6); }
    }
    .pulse-cyan-dot {
      animation: pulse-cyan 2s infinite ease-in-out;
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }
    .scanner-effect {
      position: relative;
      overflow: hidden;
    }
    .scanner-effect::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
      top: 0;
      left: 0;
      animation: scanline 4s infinite linear;
      pointer-events: none;
      opacity: 0.3;
    }

    .glass-card {
      background: var(--card-bg);
      border: var(--card-border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow-glow);
      backdrop-filter: blur(12px);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card:hover {
      border-color: rgba(0, 240, 255, 0.35);
    }

    .btn-tab {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
      display: flex;
      alignItems: center;
      gap: 6px;
    }
    .btn-tab:hover {
      color: var(--text-main);
      border-color: rgba(0, 240, 255, 0.3);
      background: rgba(0, 240, 255, 0.03);
    }
    .btn-tab.active {
      color: var(--bg-main);
      background: var(--accent-cyan);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    /* Code Block styling */
    pre {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: #03050b;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: #e5e7eb;
      overflow-x: auto;
      max-height: 400px;
    }

    /* Form control styling */
    .slider-input {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      margin: 10px 0;
    }
    .slider-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent-cyan);
      cursor: pointer;
      box-shadow: 0 0 10px var(--accent-cyan);
      transition: transform 0.1s ease;
    }
    .slider-input::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Authentication Login Screen Styles */
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
      width: 100%;
    }
    .login-card {
      background: var(--card-bg);
      border: var(--card-border);
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-glow);
      border-top: 1px solid rgba(0, 240, 255, 0.4);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
      animation: scanline 3s infinite linear;
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--accent-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      color: var(--accent-cyan);
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .login-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }
    .login-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .login-form-group {
      margin-bottom: 20px;
    }
    .login-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .login-input-wrapper {
      position: relative;
    }
    .login-input {
      width: 100%;
      background: rgba(6, 8, 19, 0.8);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 6px;
      padding: 12px 16px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }
    .login-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
      background: rgba(6, 8, 19, 0.95);
    }
    .login-btn {
      width: 100%;
      background: linear-gradient(90deg, #00d2ff, #00a8ff);
      border: none;
      border-radius: 6px;
      padding: 14px;
      color: #060813;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
      background: linear-gradient(90deg, #00f0ff, #00c0ff);
    }
    .login-btn:active {
      transform: translateY(1px);
    }
    .login-error {
      background: rgba(255, 0, 60, 0.1);
      border: 1px solid rgba(255, 0, 60, 0.3);
      color: #ff6685;
      font-size: 12px;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .login-hint {
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.02);
      padding: 8px;
      border-radius: 4px;
      border: 1px dashed rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>
  <div id="root" class="container"></div>

  <!-- React code parsed dynamically by Babel -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const {
      LineChart, Line, BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, PieChart, Pie, Cell, AreaChart, Area
    } = Recharts;

    const RISK_COLORS = { HIGH: "#ff003c", MEDIUM: "#ff9900", LOW: "#39ff14" };
    const RISK_BG = { HIGH: "rgba(255, 0, 60, 0.1)", MEDIUM: "rgba(255, 153, 0, 0.1)", LOW: "rgba(57, 255, 20, 0.1)" };
    const RISK_TEXT = { HIGH: "#ff6685", MEDIUM: "#ffbb55", LOW: "#92ff7c" };
    const RISK_LABELS = { HIGH: "HIGH RISK", MEDIUM: "MEDIUM RISK", LOW: "SAFE (LOW)" };

    const TX_TYPES = ["Card Purchase", "UPI Transfer", "ACH Pull", "ATM Withdrawal", "Wire Transfer"];
    const MERCHANTS = ["PhonePe Merchant", "GPay P2M", "Paytm Gateway", "CRED Store", "Amazon Pay Merchant", "BharatPe QR", "Crypto Exchange", "Global Remittance", "FauxBank ATM"];
    const COUNTRIES = ["US", "IN", "FR", "CN", "RU", "NG", "KP", "BR", "JP", "UK"];
    const DEVICES = [
      "Apple iPhone",
      "Apple iPad",
      "Samsung Phone",
      "Samsung Galaxy Tab",
      "Google Pixel",
      "Google Pixel Tablet",
      "OnePlus Phone",
      "OnePlus Pad",
      "Xiaomi Phone",
      "Xiaomi Pad",
      "Motorola Smartphone",
      "Realme Smartphone",
      "Oppo Smartphone",
      "Vivo Smartphone",
      "Lenovo Tablet",
      "Huawei Smartphone",
      "Huawei MatePad",
      "Asus Smartphone"
    ];

    function randomBetween(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
    const defRandomEl = (arr) => arr[Math.floor(Math.random() * arr.length)];

    // Generate highly realistic mock transactions
    function generateTransaction(id) {
      const isSuspect = Math.random() < 0.15;
      const amount = isSuspect ? randomBetween(8000, 180000) : randomBetween(10, 1500);
      const country = isSuspect ? defRandomEl(["RU", "NG", "KP", "CN"]) : defRandomEl(["US", "IN", "FR", "JP", "UK"]);
      const merchant = isSuspect ? defRandomEl(["Crypto Exchange", "Global Remittance", "FauxBank ATM"]) : defRandomEl(["PhonePe Merchant", "GPay P2M", "Paytm Gateway", "CRED Store", "Amazon Pay Merchant", "BharatPe QR"]);
      const velocity = isSuspect ? randomBetween(9, 28) : randomBetween(1, 4);
      const device = defRandomEl(DEVICES);
      const newDevice = isSuspect && Math.random() > 0.3;
      
      // Feature weights
      const amtScore = isSuspect ? randomBetween(70, 99) : randomBetween(2, 28);
      const velScore = isSuspect ? randomBetween(65, 98) : randomBetween(3, 22);
      const geoScore = isSuspect ? randomBetween(75, 96) : randomBetween(1, 15);
      const merchScore = isSuspect ? randomBetween(60, 92) : randomBetween(2, 18);
      const devScore = newDevice ? randomBetween(70, 95) : randomBetween(1, 12);

      // Score computation
      const score = Math.round((amtScore * 0.35 + velScore * 0.25 + geoScore * 0.20 + merchScore * 0.12 + devScore * 0.08));
      const risk = score >= 50 ? "HIGH" : score >= 30 ? "MEDIUM" : "LOW";
      
      const now = new Date();
      now.setSeconds(now.getSeconds() - randomBetween(0, 120));

      return {
        id: `TXN-${String(id).padStart(7, "0")}`,
        time: now.toLocaleTimeString(),
        amount,
        type: defRandomEl(TX_TYPES),
        merchant,
        country,
        velocity,
        device,
        newDevice,
        score,
        risk,
        status: risk === "HIGH" ? "Flagged" : risk === "MEDIUM" ? "Review" : "Cleared",
        features: {
          "Amount anomaly": amtScore,
          "Velocity Warning": velScore,
          "Geo mismatch": geoScore,
          "Merchant safety": merchScore,
          "Device trust": devScore,
        },
      };
    }

    // Generate historical trends data
    function generateTrends() {
      return Array.from({ length: 15 }, (_, i) => {
        const hour = `${String(i * 2).padStart(2, "0")}:00`;
        return {
          hour,
          total: randomBetween(250, 600),
          flagged: randomBetween(5, 45),
        };
      });
    }

    // Generating Static ROC and PR Curve Datapoints
    const ROC_CURVE_DATA = Array.from({ length: 101 }, (_, i) => {
      const fpr = i / 100;
      // ROC curve formula: tpr = fpr^0.15 (simulating excellent AUC of ~0.94)
      const tpr = Math.pow(fpr, 0.12);
      return { fpr: parseFloat(fpr.toFixed(2)), tpr: parseFloat(tpr.toFixed(3)) };
    });

    const PR_CURVE_DATA = Array.from({ length: 101 }, (_, i) => {
      const recall = i / 100;
      // PR curve: precision = 1.0 - recall^4 (simulating highly clean model with high precision at low recall)
      const precision = 1.0 - Math.pow(recall, 4.5);
      return { recall: parseFloat(recall.toFixed(2)), precision: parseFloat(precision.toFixed(3)) };
    });

    // ----------------------------------------------------
    // COMPONENT: Physics-Based GNN Graph Visualizer (Canvas)
    // ----------------------------------------------------
    function GnnGraphCanvas({ selectedTx, riskColors }) {
      const canvasRef = useRef(null);
      const requestRef = useRef(null);
      const stateRef = useRef({ nodes: [], links: [], hoveredNode: null });

      useEffect(() => {
        if (!selectedTx) return;

        // Initialize nodes for GNN visual
        const nodes = [
          { id: "TXN", label: selectedTx.id, type: "transaction", score: selectedTx.score, risk: selectedTx.risk, x: 250, y: 150, radius: 25, vx: 0, vy: 0 },
          { id: "ACC", label: "User Account (ACC-827361)", type: "account", score: Math.round(selectedTx.score * 0.9), x: 150, y: 80, radius: 18, vx: 0, vy: 0 },
          { id: "DEV", label: `Device (${selectedTx.device})`, type: "device", score: selectedTx.features["Device trust"], x: 350, y: 80, radius: 16, vx: 0, vy: 0 },
          { id: "GEO", label: `IP Geolocation (${selectedTx.country})`, type: "geo", score: selectedTx.features["Geo mismatch"], x: 100, y: 220, radius: 16, vx: 0, vy: 0 },
          { id: "MER", label: `Merchant (${selectedTx.merchant})`, type: "merchant", score: selectedTx.features["Merchant safety"], x: 400, y: 220, radius: 18, vx: 0, vy: 0 },
          { id: "CARD", label: "Payment Route (Visa/Mastercard)", type: "card", score: selectedTx.features["Amount anomaly"], x: 250, y: 260, radius: 16, vx: 0, vy: 0 }
        ];

        // Link node indices
        const links = [
          { source: 0, target: 1, weight: 0.85 },
          { source: 0, target: 2, weight: 0.72 },
          { source: 0, target: 3, weight: 0.91 },
          { source: 0, target: 4, weight: 0.65 },
          { source: 0, target: 5, weight: 0.88 },
          { source: 1, target: 2, weight: 0.45 },
          { source: 1, target: 3, weight: 0.62 }
        ];

        stateRef.current = { nodes, links, hoveredNode: null };
      }, [selectedTx]);

      // Animation Loop
      const animate = useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const { nodes, links } = stateRef.current;

        // Apply physics forces (Simple Attraction / Repulsion)
        const targetX = canvas.width / 2;
        const targetY = canvas.height / 2;
        
        // 1. Center Gravity
        nodes.forEach(n => {
          n.vx += (targetX - n.x) * 0.005;
          n.vy += (targetY - n.y) * 0.005;
        });

        // 2. Node Repulsion
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const dx = nodes[j].x - nodes[i].x;
            const dy = nodes[j].y - nodes[i].y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 1;
            const minDist = 90;
            if (dist < minDist) {
              const force = (minDist - dist) * 0.05;
              const fx = (dx / dist) * force;
              const fy = (dy / dist) * force;
              nodes[i].vx -= fx;
              nodes[i].vy -= fy;
              nodes[j].vx += fx;
              nodes[j].vy += fy;
            }
          }
        }

        // 3. Link Spring Constraint
        links.forEach(l => {
          const s = nodes[l.source];
          const t = nodes[l.target];
          const dx = t.x - s.x;
          const dy = t.y - s.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const targetDist = 120;
          const spring = (dist - targetDist) * 0.02;
          const fx = (dx / dist) * spring;
          const fy = (dy / dist) * spring;
          s.vx += fx;
          s.vy += fy;
          t.vx -= fx;
          t.vy -= fy;
        });

        // 4. Update Node Positions & Bounds
        nodes.forEach(n => {
          n.x += n.vx;
          n.y += n.vy;
          n.vx *= 0.85; // friction
          n.vy *= 0.85;
          
          // boundary checks
          if (n.x < 30) n.x = 30;
          if (n.x > canvas.width - 30) n.x = canvas.width - 30;
          if (n.y < 30) n.y = 30;
          if (n.y > canvas.height - 30) n.y = canvas.height - 30;
        });

        // DRAW GRAPH
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // A. Draw links (GNN message paths)
        links.forEach(l => {
          const s = nodes[l.source];
          const t = nodes[l.target];
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(t.x, t.y);
          
          // Animate pulses on links to show live GNN inference propagation!
          const pulseLoc = (Date.now() % 2000) / 2000;
          const pX = s.x + (t.x - s.x) * pulseLoc;
          const pY = s.y + (t.y - s.y) * pulseLoc;

          // Link line gradient
          ctx.strokeStyle = "rgba(59, 130, 246, 0.25)";
          ctx.lineWidth = l.weight * 2;
          ctx.stroke();

          // Pulse dot
          ctx.fillStyle = "var(--accent-cyan)";
          ctx.beginPath();
          ctx.arc(pX, pY, 3, 0, Math.PI * 2);
          ctx.fill();
        });

        // B. Draw nodes
        nodes.forEach(n => {
          // Glow effect
          ctx.shadowBlur = 10;
          if (n.type === "transaction") {
            ctx.shadowColor = RISK_COLORS[selectedTx.risk];
            ctx.fillStyle = RISK_COLORS[selectedTx.risk];
          } else {
            ctx.shadowColor = n.score > 50 ? "var(--accent-orange)" : "rgba(59, 130, 246, 0.4)";
            ctx.fillStyle = n.score > 50 ? "var(--accent-orange)" : "#1e3a8a";
          }

          // Node body
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
          ctx.fill();
          
          // Border Ring
          ctx.shadowBlur = 0;
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = stateRef.current.hoveredNode === n ? 3 : 1.5;
          ctx.stroke();

          // Type icons indicator (Text shortcode)
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 9px 'Inter'";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const iconText = n.type === "transaction" ? "TX" : n.type === "account" ? "ACC" : n.type === "device" ? "DEV" : n.type === "geo" ? "GEO" : n.type === "merchant" ? "MER" : "CRD";
          ctx.fillText(iconText, n.x, n.y);

          // Node Labels
          ctx.fillStyle = "var(--text-main)";
          ctx.font = "10px 'Inter'";
          ctx.fillText(n.type === "transaction" ? n.label : n.type, n.x, n.y + n.radius + 12);
        });

        // C. Draw Hover Card if any node is hovered
        const hovered = stateRef.current.hoveredNode;
        if (hovered) {
          ctx.fillStyle = "rgba(4, 6, 15, 0.9)";
          ctx.strokeStyle = "var(--accent-cyan)";
          ctx.lineWidth = 1;
          const boxW = 160;
          const boxH = 50;
          const bx = Math.min(canvas.width - boxW - 10, Math.max(10, hovered.x - boxW / 2));
          const by = Math.max(10, hovered.y - hovered.radius - boxH - 10);
          
          ctx.beginPath();
          ctx.roundRect(bx, by, boxW, boxH, 6);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 10px 'Inter'";
          ctx.textAlign = "left";
          ctx.textBaseline = "top";
          ctx.fillText(hovered.label, bx + 8, by + 8);

          ctx.fillStyle = "var(--text-muted)";
          ctx.font = "9px 'Inter'";
          ctx.fillText(`Type: ${hovered.type.toUpperCase()}`, bx + 8, by + 22);
          ctx.fillText(`Anomaly Vector Score: ${hovered.score}%`, bx + 8, by + 34);
        }

        requestRef.current = requestAnimationFrame(animate);
      }, [selectedTx, RISK_COLORS]);

      useEffect(() => {
        requestRef.current = requestAnimationFrame(animate);
        return () => cancelAnimationFrame(requestRef.current);
      }, [animate]);

      // Handle Mouse Move over Canvas
      const handleMouseMove = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        const { nodes } = stateRef.current;
        let found = null;
        for (let i = 0; i < nodes.length; i++) {
          const n = nodes[i];
          const dx = n.x - mx;
          const dy = n.y - my;
          if (Math.sqrt(dx * dx + dy * dy) < n.radius) {
            found = n;
            break;
          }
        }
        stateRef.current.hoveredNode = found;
      };

      return (
        <div style={{ position: "relative" }}>
          <canvas
            ref={canvasRef}
            width={500}
            height={320}
            style={{ width: "100%", background: "#03050a", borderRadius: 8, border: "1px solid rgba(255, 255, 255, 0.05)" }}

        </div>
      );
    }

      const [username, setUsername] = useState("admin");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");

      const handleSubmit = (e) => {
        e.preventDefault();
        // Check credentials
        if (username === "admin" && password === "shield-secure-2026") {
          onLoginSuccess();
        } else {
          setError("Invalid security credentials. Access denied.");
        }
      };

      return (
        <div className="login-container">
          <div className="login-card">
            <div className="login-header">
              <div className="login-logo">🛡️</div>
              <h2 className="login-title">Shield Ops Gate</h2>
              <p className="login-subtitle">Authorization required to access GNN risk analysis pipeline</p>
            </div>
            
            <form onSubmit={handleSubmit}>
              {error && (
                <div className="login-error">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{ marginRight: "6px" }}>
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                  </svg>
                  <span>{error}</span>
                </div>
              )}
              
              <div className="login-form-group">
                <label className="login-label">Operator Username</label>
                <div className="login-input-wrapper">
                  <input 
                    type="text" 
                    className="login-input" 
                    value={username} 
                    onChange={(e) => setUsername(e.target.value)}
                    required 
                  />
                </div>
              </div>
              
              <div className="login-form-group">
                <label className="login-label">Pipeline Passcode</label>
                <div className="login-input-wrapper">
                  <input 
                    type="password" 
                    className="login-input" 
                    placeholder="Enter security key..."
                    value={password} 
                    onChange={(e) => setPassword(e.target.value)}
                    required 
                  />
                </div>
              </div>
              
              <button type="submit" className="login-btn">
                <span>Unlock Console</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </button>
            </form>
            
            <div className="login-hint">
              <strong>Demo Credentials:</strong><br />
              Username: <code style={{color: "var(--accent-cyan)"}}>admin</code><br />
              Passcode: <code style={{color: "var(--accent-cyan)"}}>shield-secure-2026</code>
            </div>
          </div>
        </div>
      );
    }

    // Main App Wrapper
    function AppWrapper() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return sessionStorage.getItem("shield_authenticated") === "true";
      });

      const handleLoginSuccess = () => {
        sessionStorage.setItem("shield_authenticated", "true");
        setIsAuthenticated(true);
      };

      const handleLogout = () => {
        sessionStorage.removeItem("shield_authenticated");
        setIsAuthenticated(false);
      };

      if (!isAuthenticated) {
        return <LoginScreen onLoginSuccess={handleLoginSuccess} />;
      }

      return <FraudDashboard onLogout={handleLogout} />;
    }

    const container = document.getElementById("root");
    const root = ReactDOM.createRoot(container);
    root.render(<AppWrapper />);
  </script>
</body>
</html>
